name: CI

on:
  push:
    branches: [ 'v3.8.9-est' ]
  pull_request:
    branches: [ 'v3.8.9-est' ]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        otp: [ '21.3', '22.2' ]

    env:
      base_rmq_ref: v3.8.x
      current_rmq_ref: v3.8.9-est

    steps:
      - uses: actions/checkout@v4

      - name: Build CI image
        run: |
          docker build \
            --build-arg OTP_VERSION="${{ matrix.otp }}" \
            --tag "rabbitmq-ci:otp-${{ matrix.otp }}" \
            .

      - name: Run checks
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            --hostname rabbitmq-ci \
            --env base_rmq_ref \
            --env current_rmq_ref \
            "rabbitmq-ci:otp-${{ matrix.otp }}" \
            bash -euo pipefail -c '
              # No ssh binary in the image; git_rmq uses an SSH push URL.
              git config --global url."https://github.com/".insteadOf git@github.com:
              git config --global --add safe.directory "*"
              make fetch-deps current_rmq_ref="$current_rmq_ref"
              make xref current_rmq_ref="$current_rmq_ref"
              epmd -daemon
              make tests current_rmq_ref="$current_rmq_ref"
            '
